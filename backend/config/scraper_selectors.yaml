# Scraper CSS Selectors & API Configuration
# ─────────────────────────────────────────────
# Update these when job sites change their DOM structure or API.
# No code changes required — just update the values below.

naukri:
  # ── API-first approach (primary) ──────────────────────────
  api_url: "https://www.naukri.com/jobapi/v3/search"
  api_headers:
    appid: "109"
    systemid: "Naukri"
  cache_ttl_seconds: 7200       # 2 hours
  max_pages: 3
  results_per_page: 20
  rate_limit_per_minute: 10

  # ── Selenium fallback selectors ───────────────────────────
  job_card_container: "div.srp-jobtuple-wrapper"
  row1: "div.row1"       # Job title + apply URL
  row2: "div.row2"       # Company name + rating
  row3: "div.row3"       # Experience + location
  row4: "div.row4"       # Brief description / requirements
  row5: "div.row5"       # Tech stack tags
  row6: "div.row6"       # Posted date / metadata

# Future platforms can be added here:
# glassdoor:
#   job_card_container: "li.react-job-listing"
#   title_link: "a.job-title"
#   company_link: "span.employer-name"
